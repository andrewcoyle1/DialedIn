name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push supersedes whatever is still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: DialedIn - Development
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  build-and-test:
    name: Lint, build and unit test
    # macos-26 is GA and ships the iOS 26 SDK. The Xcode 27 image is still
    # labelled preview and is arm64-only, so it is not used here.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Pinned rather than left on the image default, which GitHub bumps
      # periodically. Xcode 26.6 is the current default on macos-26; the
      # project is objectVersion 77 with LastUpgradeCheck 2620, so 26.x opens
      # it, and 26.6 carries the iOS 26 SDK this app targets.
      - name: Select Xcode
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not present on this runner image."
            echo "Available Xcode versions:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version

      # These four files are gitignored because they hold real credentials.
      # Only the Crashlytics run-script phase reads the plists and it exits
      # early for simulator builds, so the checked-in examples are sufficient
      # to compile and to run the unit tests.
      - name: Materialise gitignored config from examples
        run: |
          set -euo pipefail
          cp DialedIn/Utilities/Keys.swift.example DialedIn/Utilities/Keys.swift
          cp DialedIn/Info.plist.example DialedIn/Info.plist
          plists=DialedIn/SupportingFiles/GoogleServicePLists
          cp "$plists/GoogleService-Info-Example.plist" "$plists/GoogleService-Info-Dev.plist"
          cp "$plists/GoogleService-Info-Example.plist" "$plists/GoogleService-Info-Prod.plist"

      - name: Install SwiftLint
        run: brew install swiftlint

      # Runs before the build so a style failure reports in a minute or two
      # rather than after a cold compile. main is at zero violations.
      - name: SwiftLint
        run: |
          swiftlint version
          swiftlint --strict

      - name: Cache Swift Package Manager checkouts
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('DialedIn.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DialedIn.xcodeproj \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath SourcePackages

      # The device lineup differs between runner images, so the destination is
      # discovered rather than hardcoded. Picking the *newest* iOS runtime
      # matters: older runtimes are often also installed and cannot run an
      # app whose deployment target is iOS 26.
      - name: Select an iPhone simulator
        id: sim
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, subprocess, sys

          raw = subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              capture_output=True, text=True, check=True,
          ).stdout
          devices = json.loads(raw)["devices"]

          def version(runtime):
              m = re.search(r"iOS-(\d+)(?:-(\d+))?", runtime)
              return (int(m.group(1)), int(m.group(2) or 0)) if m else (0, 0)

          best = None
          for runtime, devs in devices.items():
              if "SimRuntime.iOS-" not in runtime:
                  continue
              phones = [d for d in devs
                        if d.get("isAvailable") and d["name"].startswith("iPhone")]
              if not phones:
                  continue
              candidate = (version(runtime), phones[0]["name"])
              if best is None or candidate[0] > best[0]:
                  best = candidate

          if best is None:
              sys.exit("No available iPhone simulator on this runner image")

          (major, minor), name = best
          if major < 26:
              sys.exit(f"Newest iOS runtime is {major}.{minor}; need 26.0 or later")

          print(f"name={name}")
          print(f"os={major}.{minor}")
          PY

      - name: Show selected simulator
        run: echo "Testing on ${{ steps.sim.outputs.name }} (iOS ${{ steps.sim.outputs.os }})"

      # UI tests are skipped: three tests, one chronically flaky in the
      # simulator, and they need their own simulator clone. They are the bulk
      # of the wall-clock cost and the usual cause of a spurious TEST FAILED.
      - name: Build and run unit tests
        run: |
          xcodebuild test \
            -project DialedIn.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=${{ steps.sim.outputs.os }}" \
            -skip-testing:DialedInUITests \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
